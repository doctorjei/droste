# Droste cloud-init defaults.
#
# Restricts datasource probes to those droste images can plausibly see:
#   NoCloud     - file/ISO/label-based (kento, cloud-localds, hand-built ISOs)
#   ConfigDrive - Proxmox, OpenStack
#   None        - fallback; boot succeeds without first-boot config
# Skips AWS/Azure/GCE/etc (~17 datasources) to avoid useless probes.
#
# Override per-deployment by writing your own drop-in to
# /etc/cloud/cloud.cfg.d/ that lex-sorts after 99-droste.cfg.
datasource_list: [NoCloud, ConfigDrive, None]
