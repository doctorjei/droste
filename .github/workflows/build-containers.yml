name: Build Container Images

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - 'oci/seed-oci-exclude.txt'
      - '.github/actions/build-tier/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:

# droste-seed builds FROM ghcr.io/doctorjei/tenkei/canopy (pinned in its
# Containerfile). Every other tier pulls its parent by :${{ github.sha }},
# so jobs use `needs:` to mirror the dependency tree. That way a rerun of
# a failed leaf job skips the ancestors that already succeeded, and tiers
# at the same depth build in parallel.

permissions:
  contents: read
  packages: write

jobs:
  # Depth 0: no parent tier
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: seed

  # Depth 1: children of seed
  lint:
    runs-on: ubuntu-latest
    needs: seed
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: lint
          base-tier: seed

  fiber:
    runs-on: ubuntu-latest
    needs: seed
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: fiber
          base-tier: seed

  # Depth 2
  root:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: root
          base-tier: lint

  thread:
    runs-on: ubuntu-latest
    needs: fiber
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: thread
          base-tier: fiber

  sheet:
    runs-on: ubuntu-latest
    needs: fiber
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: sheet
          base-tier: fiber

  # Depth 3
  hair:
    runs-on: ubuntu-latest
    needs: thread
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: hair
          base-tier: thread

  yarn:
    runs-on: ubuntu-latest
    needs: sheet
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: yarn
          base-tier: sheet

  page:
    runs-on: ubuntu-latest
    needs: sheet
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: page
          base-tier: sheet

  # Depth 4
  wool:
    runs-on: ubuntu-latest
    needs: yarn
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: wool
          base-tier: yarn

  fabric:
    runs-on: ubuntu-latest
    needs: page
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: fabric
          base-tier: page

  tome:
    runs-on: ubuntu-latest
    needs: page
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: tome
          base-tier: page

  # Depth 5
  felt:
    runs-on: ubuntu-latest
    needs: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: felt
          base-tier: fabric

  tapestry:
    runs-on: ubuntu-latest
    needs: tome
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: tapestry
          base-tier: tome

  press:
    runs-on: ubuntu-latest
    needs: tome
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: press
          base-tier: tome

  # Depth 6
  amimono:
    runs-on: ubuntu-latest
    needs: tapestry
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: amimono
          base-tier: tapestry

  loom:
    runs-on: ubuntu-latest
    needs: press
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: loom
          base-tier: press

  gutenberg:
    runs-on: ubuntu-latest
    needs: press
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: gutenberg
          base-tier: press

  # Depth 7
  stuffer:
    runs-on: ubuntu-latest
    needs: loom
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: stuffer
          base-tier: loom

  jacquard:
    runs-on: ubuntu-latest
    needs: gutenberg
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: jacquard
          base-tier: gutenberg

  # Depth 8
  stuffinator:
    runs-on: ubuntu-latest
    needs: jacquard
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tier
        with:
          tier: stuffinator
          base-tier: jacquard
