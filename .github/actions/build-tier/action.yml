name: Build, check, and push droste tier
description: >
  Build a single droste tier into the local docker daemon, run its
  drostify check file against the built image, and push to GHCR only
  if checks pass. Optionally passes a BASE_IMAGE build-arg pointing at
  a parent tier pinned by the current commit SHA. Caches per-tier via
  GHA cache; scope folds in a hash of every image-content input so a
  change anywhere in containers/** or oci/** invalidates all tiers'
  caches together (prevents stale-layer reuse when a parent tier's
  Containerfile changes).

inputs:
  tier:
    description: Tier name (e.g. seed, fiber, wool). Used for Containerfile path and image name.
    required: true
  base-tier:
    description: >
      Parent tier name (e.g. seed). Leave empty for tiers with no parent
      (only droste-seed — it builds FROM canopy, not another droste tier).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build into the local docker daemon (load=true) rather than pushing
    # directly. This lets the check step run `docker exec` against the
    # built image before any tag hits GHCR. If checks fail, the push
    # step is skipped (needs: chain will also stop downstream builds).
    - name: Build and load ${{ inputs.tier }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: containers/droste-${{ inputs.tier }}/Containerfile
        load: true
        tags: droste-${{ inputs.tier }}:latest
        build-args: ${{ inputs.base-tier != '' && format('BASE_IMAGE=ghcr.io/{0}/droste-{1}:{2}', github.repository_owner, inputs.base-tier, github.sha) || '' }}
        cache-from: type=gha,scope=${{ inputs.tier }}-${{ hashFiles('containers/droste-*/Containerfile', 'containers/droste-*/*.txt', 'oci/**') }}
        cache-to: type=gha,mode=max,scope=${{ inputs.tier }}-${{ hashFiles('containers/droste-*/Containerfile', 'containers/droste-*/*.txt', 'oci/**') }}

    # drostify test starts the container with `sleep infinity`, execs
    # each check line against it (own file + @quiet inherited files),
    # and exits non-zero on any failure. File-system checks (symlinks,
    # fstab, dpkg-installed packages, config contents) all work this
    # way regardless of tier type.
    - name: Run drostify checks against ${{ inputs.tier }}
      shell: bash
      # GHA ubuntu-latest has both docker and podman; docker/build-push-
      # action loads into docker's storage, so force drostify to use
      # docker (podman wouldn't see the loaded image and would try to
      # pull from a registry).
      env:
        CONTAINER_CMD: docker
      run: scripts/drostify test ${{ inputs.tier }}

    - name: Tag for GHCR
      shell: bash
      run: |
        docker tag droste-${{ inputs.tier }}:latest \
          ghcr.io/${{ github.repository_owner }}/droste-${{ inputs.tier }}:latest
        docker tag droste-${{ inputs.tier }}:latest \
          ghcr.io/${{ github.repository_owner }}/droste-${{ inputs.tier }}:${{ github.sha }}

    - name: Push to GHCR
      shell: bash
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/droste-${{ inputs.tier }}:latest
        docker push ghcr.io/${{ github.repository_owner }}/droste-${{ inputs.tier }}:${{ github.sha }}
